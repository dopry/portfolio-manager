name: CI

on:
  push:
  workflow_dispatch:

# One CI run at a time per branch: back-to-back pushes cancel the stale run
# instead of doubling load on the ESPM test API. On main/next, queue instead
# of cancel so an in-flight release is never killed mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' }}

jobs:
  test:
    name: checks (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "lts/*", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: node ./dist/cli.js --help # Run the CLI to ensure it works, we had some test releases where this was broken during the esm migration

  live-test:
    name: live tests (node lts/*)
    runs-on: ubuntu-latest
    # CI and nightly E2E share the provider account and its low API rate limit.
    # One repository-wide lock prevents their live requests from overlapping.
    concurrency:
      group: espm-test-env
      cancel-in-progress: false
    env:
      PM_USERNAME: ${{ secrets.TEST_PM_USERNAME }}
      PM_PASSWORD: ${{ secrets.TEST_PM_PASSWORD }}
      PM_USERNAME2: ${{ secrets.TEST_PM_USERNAME2 }}
      PM_PASSWORD2: ${{ secrets.TEST_PM_PASSWORD2 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  live-env-whats-changed:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    uses: ./.github/workflows/live-env-whats-changed.yml
    secrets:
      LIVE_PM_USERNAME: ${{ secrets.LIVE_PM_USERNAME }}
      LIVE_PM_PASSWORD: ${{ secrets.LIVE_PM_PASSWORD }}

  release:
    needs: [test, live-test, live-env-whats-changed]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    # Only one release at a time per branch; queued pushes wait rather than race.
    concurrency:
      group: release-${{ github.ref }}
    permissions:
      contents: write # create tags and GitHub releases
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing via OIDC
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release analyzes the full commit history
          persist-credentials: false # semantic-release authenticates with GITHUB_TOKEN instead
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Update npm # trusted publishing requires npm >= 11.5.1
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node ./dist/cli.js --help # Run the CLI to ensure it works, we had some test releases where this was broken during the esm migration
      - name: Semantic Release with Trusted Publishing via OIDC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
