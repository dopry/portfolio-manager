name: CI

on:
  pull_request:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

# One CI run at a time per ref. Never cancel an active run: credentialed E2E
# jobs mutate shared state and must reach their cleanup hooks. GitHub may still
# replace an older pending run when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: checks (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.2", "lts/*", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: node ./dist/cli.js --help # Run the CLI to ensure it works, we had some test releases where this was broken during the esm migration

  wstest-e2e:
    name: wstest-e2e
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # CI and the full WSTest E2E workflow share the provider account and its
    # low API rate limit. One repository-wide lock prevents overlap.
    concurrency:
      group: espm-wstest-e2e
      cancel-in-progress: false
    env:
      PM_USERNAME: ${{ secrets.TEST_PM_USERNAME }}
      PM_PASSWORD: ${{ secrets.TEST_PM_PASSWORD }}
      PM_USERNAME2: ${{ secrets.TEST_PM_USERNAME2 }}
      PM_PASSWORD2: ${{ secrets.TEST_PM_PASSWORD2 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Run unit and WSTest API E2E tests with coverage
        run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck:wstest-e2e
      - name: Run WSTest E2E tests
        id: wstest-e2e
        shell: bash
        run: bash .github/scripts/run-wstest-e2e.sh
      - name: Upload Playwright traces
        if: failure() || steps.wstest-e2e.outputs.retried == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wstest-e2e-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  live-e2e:
    name: live-e2e
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CI and scheduled/manual Live E2E runs mutate the same persistent fixture.
    concurrency:
      group: espm-live-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck:live-e2e
      - name: Run Live E2E tests
        env:
          PM_USERNAME: ${{ secrets.LIVE_PM_USERNAME }}
          PM_PASSWORD: ${{ secrets.LIVE_PM_PASSWORD }}
        run: npm run test:live-e2e

  release:
    needs: [checks, wstest-e2e, live-e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    # Only one release at a time per branch; queued pushes wait rather than race.
    concurrency:
      group: release-${{ github.ref }}
    permissions:
      contents: write # create tags and GitHub releases
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing via OIDC
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release analyzes the full commit history
          persist-credentials: false # semantic-release authenticates with GITHUB_TOKEN instead
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Update npm # trusted publishing requires npm >= 11.5.1
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node ./dist/cli.js --help # Run the CLI to ensure it works, we had some test releases where this was broken during the esm migration
      - name: Semantic Release with Trusted Publishing via OIDC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
