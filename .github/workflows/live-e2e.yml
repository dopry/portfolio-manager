name: live-e2e

on:
  schedule:
    # Refresh the persistent fixture every Monday at 10:43 UTC.
    - cron: "43 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Live E2E tests mutate persistent fixtures. Never overlap them.
concurrency:
  group: espm-live-e2e
  cancel-in-progress: false

jobs:
  live-e2e:
    name: live-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck:live-e2e
      - name: Run Live E2E tests
        env:
          PM_USERNAME: ${{ secrets.LIVE_PM_USERNAME }}
          PM_PASSWORD: ${{ secrets.LIVE_PM_PASSWORD }}
        run: npm run test:live-e2e
