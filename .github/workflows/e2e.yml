name: E2E

# Connection/sharing lifecycle against the shared ESPM test environment.
# Runs nightly (and on demand) rather than per-PR: the suite drives the
# pmtest web UI with Playwright, mutates shared stateful test accounts, and
# is subject to upstream UI drift — see plans/connection-sharing-e2e-tests.md.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# The provider/peer test accounts are a shared singleton; runs must serialize.
concurrency:
  group: espm-test-env
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PM_USERNAME: ${{ secrets.TEST_PM_USERNAME }}
      PM_PASSWORD: ${{ secrets.TEST_PM_PASSWORD }}
      PM_USERNAME2: ${{ secrets.TEST_PM_USERNAME2 }}
      PM_PASSWORD2: ${{ secrets.TEST_PM_PASSWORD2 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck:e2e
      - name: Run E2E tests
        id: e2e
        shell: bash
        run: |
          run_e2e() {
            local attempt="$1"
            echo "::group::E2E attempt ${attempt}/2"
            export E2E_TRACE_DIR="test-results/e2e/attempt-${attempt}"
            local test_exit=0
            npm run test:e2e || test_exit=$?
            echo "::endgroup::"
            return "$test_exit"
          }

          if run_e2e 1; then
            exit 0
          fi

          # Every suite invocation updates the independent provider-managed
          # What's Changed fixture, then establishes a clean UI-peer baseline.
          # A failed lifecycle run cleans up in afterAll so the retry can start
          # without an account-wide wipe.
          echo "retried=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          {
            echo "## E2E retry"
            echo "Attempt 1 failed; the suite was retried after a 30-second backoff."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "::warning::E2E attempt 1 failed; retrying the clean suite in 30 seconds"
          sleep 30

          run_e2e 2
      # Tracing starts after login (EspmWebUi), so no credentials appear in
      # these artifacts; residual content is post-auth pages/session data for
      # throwaway test-environment accounts.
      - name: Upload Playwright traces
        if: failure() || steps.e2e.outputs.retried == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
